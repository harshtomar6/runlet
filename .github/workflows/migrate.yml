name: Migrate

# Applies pending Drizzle migrations to the production database. Runs on pushes
# to main that touch the schema/migrations (drizzle-kit migrate is idempotent —
# already-applied migrations are skipped), and can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
      - "src/storage/postgres/schema.ts"
  workflow_dispatch: {}

# Never run two migration jobs at once (they'd race on the migration lock).
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Must match the environment where the secret lives so its secrets resolve.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify DATABASE_URL is configured
        # Accept either secret name (DATABASE_URL preferred; DATABASE_SECRET fallback).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DB connection string. Set secret DATABASE_URL (or DATABASE_SECRET) on the Production environment = your Neon URL."
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_SECRET }}
        run: pnpm db:migrate
