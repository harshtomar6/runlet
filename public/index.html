<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>app-automations · dev console</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
        --text: #e6e9ef; --muted: #93a0b4; --accent: #6ea8fe; --ok: #4ade80;
        --err: #f87171; --warn: #fbbf24; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      header { position: sticky; top: 0; z-index: 5; background: var(--panel);
        border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex;
        gap: 10px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
      header .cfg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
      input, textarea, select, button { font: inherit; color: var(--text);
        background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
      input, select { min-width: 90px; }
      textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
      button { cursor: pointer; background: var(--panel2); }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
      label { color: var(--muted); font-size: 12px; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 12px; padding: 12px; padding-bottom: 42vh; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
      .card h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
        background: var(--panel2); font-weight: 600; }
      .card .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .row > * { flex: 1; min-width: 0; }
      .row > button { flex: 0 0 auto; }
      .out { background: #0b0d12; border: 1px solid var(--border); border-radius: 6px;
        padding: 6px 8px; margin: 0; max-height: 240px; overflow: auto; font-size: 12px;
        font-family: var(--mono); }
      .out:empty { display: none; }
      .out-bar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
      button.mini { padding: 2px 7px; font-size: 11px; border-radius: 5px; }
      /* JSON tree */
      .jv { font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
      .jv-children { padding-left: 14px; border-left: 1px solid #232833; }
      .jv-line { cursor: default; }
      .jv-node > .jv-line { user-select: none; }
      .jv-tog { display: inline-block; width: 12px; color: var(--muted); transition: transform .12s; }
      .jv-node.collapsed > .jv-line > .jv-tog { transform: rotate(-90deg); }
      .jv-node.collapsed > .jv-children, .jv-node.collapsed > .jv-closeline { display: none; }
      .jv-node:not(.collapsed) > .jv-line > .jv-sum,
      .jv-node:not(.collapsed) > .jv-line > .jv-close-inline { display: none; }
      .jv-node.empty > .jv-line > .jv-tog { visibility: hidden; }
      .jv-node.empty > .jv-children, .jv-node.empty > .jv-closeline { display: none; }
      .jv-key { color: #7dd3fc; }
      .jv-str { color: #86efac; }
      .jv-num { color: #fbbf24; }
      .jv-bool { color: #c4b5fd; }
      .jv-null { color: #6b7280; }
      .jv-punc { color: #6b7280; }
      .jv-sum { color: var(--muted); font-style: italic; }
      /* modal */
      .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex;
        align-items: center; justify-content: center; padding: 24px; }
      .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
        width: min(920px, 100%); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
      .modal-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
        border-bottom: 1px solid var(--border); background: var(--panel2); }
      .modal-bar strong { flex: 1; font-size: 13px; }
      .modal-body { padding: 12px 14px; overflow: auto; background: #0b0d12; }
      .hint { color: var(--muted); font-size: 12px; }
      /* console drawer */
      #console { position: fixed; bottom: 0; left: 0; right: 0; height: 38vh;
        background: var(--panel); border-top: 2px solid var(--border); display: flex;
        flex-direction: column; z-index: 10; transition: transform .18s ease; }
      body.console-hidden #console { transform: translateY(calc(100% - 38px)); }
      #console .bar { height: 38px; display: flex; align-items: center; gap: 10px;
        padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel2); }
      #console .bar strong { font-size: 13px; }
      #console .log { flex: 1; overflow: auto; padding: 6px 0; font-family: var(--mono); font-size: 12px; }
      .entry { border-bottom: 1px solid #20242e; }
      .entry summary { list-style: none; cursor: pointer; padding: 5px 12px; display: flex; gap: 8px; align-items: baseline; }
      .entry summary::-webkit-details-marker { display: none; }
      .method { font-weight: 700; min-width: 46px; }
      .status { min-width: 40px; font-weight: 700; }
      .status.s2 { color: var(--ok); } .status.s4, .status.s5, .status.serr { color: var(--err); }
      .path { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ms { color: var(--muted); }
      .entry .detail { padding: 4px 12px 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .entry .detail h4 { margin: 0; color: var(--muted); font-size: 11px; text-transform: uppercase; flex: 1; }
      .pane-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
      .entry .detail .jv { background: #0b0d12; border: 1px solid var(--border); border-radius: 6px;
        padding: 8px; max-height: 200px; overflow: auto; }
      @media (max-width: 640px) { .entry .detail { grid-template-columns: 1fr; } }
      .pill { font-size: 11px; color: var(--muted); }
      /* workflow graph */
      .card.wide { grid-column: 1 / -1; }
      .graph { overflow: auto; max-height: 62vh; background: #0b0d12; border: 1px solid var(--border); border-radius: 8px; }
      .gcanvas { position: relative; }
      .gsvg { position: absolute; left: 0; top: 0; }
      .gedge { fill: none; stroke: #5b6577; stroke-width: 1.6; }
      .gport { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
      .gnode { position: absolute; background: var(--panel2); border: 1px solid var(--border);
        border-left: 3px solid var(--accent); border-radius: 6px; padding: 6px 8px; overflow: hidden; }
      .gid { font-weight: 600; font-size: 12px; }
      .gtype { color: var(--muted); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .app-trigger { border-left-color: #4ade80; }
      .app-control { border-left-color: #fbbf24; }
      .app-ai { border-left-color: #a78bfa; }
      .app-email { border-left-color: #6ea8fe; }
      .app-slack { border-left-color: #34d399; }
      .app-http { border-left-color: #f472b6; }
      .app-util { border-left-color: #93a0b4; }
      /* live run status on graph nodes */
      .gnode { transition: box-shadow .15s ease, border-color .15s ease; }
      .gnode.st-running { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
      .gnode.st-ok { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
      .gnode.st-fail { border-color: var(--err); box-shadow: 0 0 0 2px var(--err); }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px var(--warn); } 50% { box-shadow: 0 0 0 5px rgba(251,191,36,.35); } }
      .gnode.st-running { animation: pulse 1s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <header>
      <h1>⚙︎ app-automations</h1>
      <div class="cfg">
        <label>base <input id="cfg-base" value="" style="min-width:150px" /></label>
        <label>owner <input id="cfg-owner" value="dev" style="min-width:70px" /></label>
        <label>api key <input id="cfg-key" placeholder="(optional)" style="min-width:120px" /></label>
        <span class="pill">run: <code>STORE=memory AUTH_DEV_OWNER=dev pnpm dev</code></span>
      </div>
      <button id="toggle-console">Console ▾</button>
    </header>

    <main id="main"></main>

    <section id="console">
      <div class="bar">
        <strong>Console</strong>
        <span class="pill" id="console-count">0 calls</span>
        <span style="flex:1"></span>
        <button id="console-clear">Clear</button>
        <button id="console-hide">Hide ▾</button>
      </div>
      <div class="log" id="console-log"></div>
    </section>

    <script>
      // ---------- config + API helper (logs every call to the console) ----------
      const $ = (id) => document.getElementById(id);
      $("cfg-base").value = location.origin;

      function cfg() {
        return {
          base: $("cfg-base").value.replace(/\/+$/, ""),
          owner: $("cfg-owner").value.trim(),
          key: $("cfg-key").value.trim(),
        };
      }

      let callCount = 0;
      function logEntry({ method, path, status, ms, request, response }) {
        callCount++;
        $("console-count").textContent = callCount + (callCount === 1 ? " call" : " calls");
        const cls = status === "ERR" ? "serr" : "s" + String(status)[0];
        const e = document.createElement("details");
        e.className = "entry";
        const summary = mk("summary");
        summary.innerHTML =
          '<span class="method">' + method + '</span>' +
          '<span class="status ' + cls + '">' + status + '</span>' +
          '<span class="path"></span><span class="ms">' + ms + 'ms</span>';
        summary.querySelector(".path").textContent = path;
        e.appendChild(summary);
        const detail = mk("div", "detail");
        const req = request === undefined ? "(no body)" : request;
        detail.appendChild(pane("request", req));
        detail.appendChild(pane("response", response));
        e.appendChild(detail);
        $("console-log").prepend(e);
      }

      // a labelled pane with an ⤢ expand button + collapsible JSON tree
      function pane(label, value) {
        const wrap = mk("div");
        const head = mk("div", "pane-head");
        head.appendChild(mk("h4", null, label));
        const btn = mk("button", "mini", "⤢");
        btn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); openModal(value); };
        head.appendChild(btn);
        wrap.appendChild(head);
        wrap.appendChild(jsonView(value));
        return wrap;
      }

      async function api(method, path, body) {
        const { base, owner, key } = cfg();
        const headers = {};
        if (body !== undefined) headers["content-type"] = "application/json";
        if (key) headers["authorization"] = "Bearer " + key;
        if (owner) headers["x-owner-id"] = owner;
        const t0 = performance.now();
        try {
          const res = await fetch(base + path, {
            method,
            headers,
            body: body !== undefined ? JSON.stringify(body) : undefined,
          });
          const text = await res.text();
          let data;
          try { data = JSON.parse(text); } catch { data = text; }
          logEntry({ method, path, status: res.status, ms: Math.round(performance.now() - t0), request: body, response: data, ok: res.ok });
          return { status: res.status, ok: res.ok, data };
        } catch (err) {
          logEntry({ method, path, status: "ERR", ms: Math.round(performance.now() - t0), request: body, response: String(err), ok: false });
          throw err;
        }
      }

      const parseJSON = (s, fallback) => { try { return JSON.parse(s); } catch { return fallback; } };

      // ---------- color-coded, collapsible JSON viewer ----------
      function mk(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function jvValue(v) {
        if (v === null) return mk("span", "jv-null", "null");
        if (v === undefined) return mk("span", "jv-null", "undefined");
        const t = typeof v;
        if (t === "string") return mk("span", "jv-str", JSON.stringify(v));
        if (t === "number") return mk("span", "jv-num", String(v));
        if (t === "boolean") return mk("span", "jv-bool", String(v));
        if (Array.isArray(v)) return jvContainer("[", "]", v.map((val) => ({ key: null, val })));
        if (t === "object") return jvContainer("{", "}", Object.entries(v).map(([key, val]) => ({ key, val })));
        return mk("span", "jv-str", String(v));
      }
      function jvContainer(open, close, entries) {
        const node = mk("div", "jv-node");
        const line = mk("div", "jv-line");
        line.appendChild(mk("span", "jv-tog", "▾"));
        line.appendChild(mk("span", "jv-punc", open));
        line.appendChild(mk("span", "jv-sum", " " + entries.length + (open === "[" ? " items " : " keys ")));
        line.appendChild(mk("span", "jv-punc jv-close-inline", close));
        node.appendChild(line);
        const children = mk("div", "jv-children");
        entries.forEach((e, i) => {
          const row = mk("div", "jv-row");
          if (e.key !== null) {
            row.appendChild(mk("span", "jv-key", JSON.stringify(e.key)));
            row.appendChild(mk("span", "jv-punc", ": "));
          }
          row.appendChild(jvValue(e.val));
          if (i < entries.length - 1) row.appendChild(mk("span", "jv-punc", ","));
          children.appendChild(row);
        });
        node.appendChild(children);
        const closeLine = mk("div", "jv-closeline");
        closeLine.appendChild(mk("span", "jv-punc", close));
        node.appendChild(closeLine);
        if (entries.length === 0) node.classList.add("empty");
        else line.onclick = () => node.classList.toggle("collapsed");
        return node;
      }
      function jsonView(v) {
        const root = mk("div", "jv");
        root.appendChild(jvValue(v));
        return root;
      }
      function openModal(v) {
        const m = mk("div", "modal");
        const box = mk("div", "modal-box");
        const bar = mk("div", "modal-bar");
        bar.appendChild(mk("strong", null, "JSON"));
        const expand = mk("button", "mini", "Expand all");
        const collapse = mk("button", "mini", "Collapse all");
        const copy = mk("button", "mini", "Copy");
        const close = mk("button", "mini", "✕");
        bar.append(expand, collapse, copy, close);
        const body = mk("div", "modal-body");
        const view = jsonView(v);
        body.appendChild(view);
        expand.onclick = () => view.querySelectorAll(".jv-node.collapsed").forEach((n) => n.classList.remove("collapsed"));
        collapse.onclick = () => view.querySelectorAll(".jv-node:not(.empty)").forEach((n) => n.classList.add("collapsed"));
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(JSON.stringify(v, null, 2)); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy"), 1000); } catch (e) { /* ignore */ }
        };
        close.onclick = () => m.remove();
        box.append(bar, body);
        m.appendChild(box);
        m.onclick = (e) => { if (e.target === m) m.remove(); };
        const esc = (e) => { if (e.key === "Escape") { m.remove(); document.removeEventListener("keydown", esc); } };
        document.addEventListener("keydown", esc);
        document.body.appendChild(m);
      }

      // render a value into a card output box: expand button + JSON tree
      function show(container, v) {
        container.innerHTML = "";
        const bar = mk("div", "out-bar");
        const btn = mk("button", "mini", "⤢ expand");
        btn.onclick = () => openModal(v);
        bar.appendChild(btn);
        container.appendChild(bar);
        container.appendChild(jsonView(v));
      }

      // ---------- workflow graph (layered DAG: longest-path layering) ----------
      function renderGraph(container, def) {
        const nodes = (def && def.nodes) || [];
        const edges = (def && def.edges) || [];
        container.innerHTML = "";
        if (!nodes.length) { container.textContent = "No nodes to render."; return; }

        const byId = new Map(nodes.map((n) => [n.id, n]));
        const adj = new Map(nodes.map((n) => [n.id, []]));
        const indeg = new Map(nodes.map((n) => [n.id, 0]));
        for (const e of edges) {
          if (byId.has(e.from.nodeId) && byId.has(e.to.nodeId)) {
            adj.get(e.from.nodeId).push(e);
            indeg.set(e.to.nodeId, indeg.get(e.to.nodeId) + 1);
          }
        }
        const level = new Map(nodes.map((n) => [n.id, 0]));
        const indeg2 = new Map(indeg);
        const q = nodes.filter((n) => indeg.get(n.id) === 0).map((n) => n.id);
        while (q.length) {
          const id = q.shift();
          for (const e of adj.get(id)) {
            const t = e.to.nodeId;
            level.set(t, Math.max(level.get(t), level.get(id) + 1));
            indeg2.set(t, indeg2.get(t) - 1);
            if (indeg2.get(t) === 0) q.push(t);
          }
        }
        const cols = {};
        for (const n of nodes) { const l = level.get(n.id) || 0; (cols[l] = cols[l] || []).push(n.id); }

        const colW = 210, rowH = 84, boxW = 160, boxH = 52, padX = 24, padY = 24;
        const pos = new Map();
        let maxLevel = 0, maxRows = 0;
        for (const l of Object.keys(cols).map(Number).sort((a, b) => a - b)) {
          maxLevel = Math.max(maxLevel, l);
          maxRows = Math.max(maxRows, cols[l].length);
          cols[l].forEach((id, i) => pos.set(id, { x: padX + l * colW, y: padY + i * rowH }));
        }
        const W = padX * 2 + (maxLevel + 1) * colW;
        const H = padY * 2 + maxRows * rowH;

        const canvas = document.createElement("div");
        canvas.className = "gcanvas";
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("width", W); svg.setAttribute("height", H); svg.classList.add("gsvg");
        svg.innerHTML =
          '<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">' +
          '<path d="M0,0 L8,4 L0,8 z" fill="#5b6577"/></marker></defs>';
        for (const e of edges) {
          const a = pos.get(e.from.nodeId), b = pos.get(e.to.nodeId);
          if (!a || !b) continue;
          const x1 = a.x + boxW, y1 = a.y + boxH / 2, x2 = b.x, y2 = b.y + boxH / 2, mx = (x1 + x2) / 2;
          const path = document.createElementNS(ns, "path");
          path.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
          path.setAttribute("class", "gedge");
          path.setAttribute("marker-end", "url(#arw)");
          svg.appendChild(path);
          if (e.from.port && e.from.port !== "out" && e.from.port !== "in") {
            const t = document.createElementNS(ns, "text");
            t.setAttribute("x", x1 + 6); t.setAttribute("y", y1 - 4); t.setAttribute("class", "gport");
            t.textContent = e.from.port;
            svg.appendChild(t);
          }
        }
        canvas.appendChild(svg);

        for (const n of nodes) {
          const p = pos.get(n.id);
          const d = document.createElement("div");
          d.className = "gnode app-" + n.type.split(".")[0];
          d.dataset.nid = n.id;
          d.style.left = p.x + "px"; d.style.top = p.y + "px";
          d.style.width = boxW + "px"; d.style.height = boxH + "px";
          d.innerHTML = '<div class="gid"></div><div class="gtype"></div>';
          d.querySelector(".gid").textContent = n.id;
          d.querySelector(".gtype").textContent = n.type;
          canvas.appendChild(d);
        }
        container.appendChild(canvas);
      }

      // ---------- live run status on the graph ----------
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const TERMINAL = ["succeeded", "failed", "cancelled"];

      function statusesFromEvents(events) {
        const m = new Map();
        for (const e of events || []) {
          if (!e.nodeId) continue;
          if (e.type === "node.started") m.set(e.nodeId, "running");
          else if (e.type === "node.executed") m.set(e.nodeId, "ok");
          else if (e.type === "node.failed") m.set(e.nodeId, "fail");
        }
        return m;
      }

      function paint(container, statuses) {
        container.querySelectorAll(".gnode").forEach((el) => {
          el.classList.remove("st-running", "st-ok", "st-fail");
          const s = statuses.get(el.dataset.nid);
          if (s) el.classList.add("st-" + (s === "ok" ? "ok" : s === "fail" ? "fail" : "running"));
        });
      }

      // Watch a run: render its pinned version, then either animate the finished
      // events (local runs complete instantly) or poll live (qstash mode).
      async function watchRun(runId) {
        const g = document.querySelector("[data-graph]");
        if (!g || !runId) return;
        const first = await api("GET", "/runs/" + runId);
        if (!first.ok) return;
        const run = first.data.data.run;
        const vr = await api("GET", "/workflows/" + run.workflowId + "/versions");
        const version = ((vr.data && vr.data.data) || []).find((v) => v.id === run.versionId);
        if (version) renderGraph(g, version);

        if (TERMINAL.includes(run.status)) {
          // animated replay so you see nodes light up in order
          const evs = (first.data.data.events || []).filter(
            (e) => e.nodeId && ["node.started", "node.executed", "node.failed"].includes(e.type),
          );
          const acc = new Map();
          for (const e of evs) {
            acc.set(e.nodeId, e.type === "node.executed" ? "ok" : e.type === "node.failed" ? "fail" : "running");
            paint(g, new Map(acc));
            await sleep(240);
          }
          paint(g, statusesFromEvents(first.data.data.events));
        } else {
          // live polling
          paint(g, statusesFromEvents(first.data.data.events));
          for (let i = 0; i < 60 && !TERMINAL.includes(run.status); i++) {
            await sleep(600);
            const r = await api("GET", "/runs/" + runId);
            Object.assign(run, r.data.data.run);
            paint(g, statusesFromEvents(r.data.data.events));
          }
        }
      }

      // console toggle
      $("toggle-console").onclick = () => document.body.classList.toggle("console-hidden");
      $("console-hide").onclick = () => document.body.classList.add("console-hidden");
      $("console-clear").onclick = () => { $("console-log").innerHTML = ""; callCount = 0; $("console-count").textContent = "0 calls"; };

      // ---------- shared state (chain ids across cards) ----------
      const state = { workflowId: "", versionId: "", runId: "" };
      function syncIds() {
        document.querySelectorAll("[data-bind=workflowId]").forEach((i) => { if (!i.value) i.value = state.workflowId; });
        document.querySelectorAll("[data-bind=versionId]").forEach((i) => { if (!i.value) i.value = state.versionId; });
        document.querySelectorAll("[data-bind=runId]").forEach((i) => { if (!i.value) i.value = state.runId; });
      }

      // ---------- cards ----------
      const EXAMPLE_WF = JSON.stringify(
        {
          name: "demo",
          trigger: { type: "manual" },
          nodes: [
            { id: "t", type: "trigger.manual", params: {} },
            { id: "ai", type: "ai.complete", params: { model: "openai/gpt-4o-mini", prompt: "Greet {{ trigger.name }} in one line." } },
            { id: "log", type: "util.log", params: { message: "AI said: {{ ai.text }}" } },
          ],
          edges: [
            { from: { nodeId: "t", port: "out" }, to: { nodeId: "ai", port: "in" } },
            { from: { nodeId: "ai", port: "success" }, to: { nodeId: "log", port: "in" } },
          ],
        },
        null, 2,
      );

      const cards = [
        {
          title: "Node catalog",
          html: `
            <div class="row">
              <button data-act="catalog">GET /node-types</button>
              <button data-act="catalogGrouped">?grouped=true</button>
            </div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=catalog]').onclick = async () => show(out, (await api("GET", "/node-types")).data.data.map((n) => n.type));
            el.querySelector('[data-act=catalogGrouped]').onclick = async () => show(out, (await api("GET", "/node-types?grouped=true")).data.data);
          },
        },
        {
          title: "Create workflow",
          html: `
            <textarea data-wf rows="12"></textarea>
            <div class="row"><button class="primary" data-act="create">POST /workflows</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            el.querySelector("[data-wf]").value = EXAMPLE_WF;
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=create]').onclick = async () => {
              const body = parseJSON(el.querySelector("[data-wf]").value, null);
              if (!body) return show(out, "Invalid JSON");
              const r = await api("POST", "/workflows", body);
              if (r.ok) { state.workflowId = r.data.data.workflow.id; state.versionId = r.data.data.version.id; syncIds(); }
              show(out, r.data);
              const g = document.querySelector("[data-graph]");
              if (g) renderGraph(g, body); // draw the graph we just created
            };
          },
        },
        {
          title: "Workflow graph",
          wide: true,
          html: `
            <div class="row">
              <button data-act="fromEditor">Render editor JSON</button>
              <input data-bind="workflowId" placeholder="workflowId" />
              <input data-bind="versionId" placeholder="versionId (blank = latest)" />
              <button data-act="load">Load version</button>
            </div>
            <div class="graph" data-graph></div>
            <p class="hint">Auto-drawn on create. Columns = topological depth; left border colored by node group.</p>`,
          wire(el) {
            const g = el.querySelector("[data-graph]");
            el.querySelector('[data-act=fromEditor]').onclick = () => {
              const def = parseJSON(document.querySelector("[data-wf]").value, null);
              if (def) renderGraph(g, def); else g.textContent = "Invalid JSON in Create workflow.";
            };
            el.querySelector('[data-act=load]').onclick = async () => {
              const wf = el.querySelector('[data-bind=workflowId]').value.trim();
              const vid = el.querySelector('[data-bind=versionId]').value.trim();
              const r = await api("GET", "/workflows/" + wf + "/versions");
              const versions = (r.data && r.data.data) || [];
              const v = vid ? versions.find((x) => x.id === vid) : versions[0];
              if (v) renderGraph(g, v); else g.textContent = "No matching version.";
            };
          },
        },
        {
          title: "Workflow ops",
          html: `
            <div class="row"><input data-bind="workflowId" placeholder="workflowId" /><input data-bind="versionId" placeholder="versionId" /></div>
            <div class="row">
              <button data-act="validate">Validate</button>
              <button data-act="activate">Activate</button>
              <button data-act="get">Get</button>
              <button data-act="versions">Versions</button>
              <button data-act="list">List all</button>
            </div>
            <label>execute input (JSON)</label>
            <textarea data-input rows="3">{ "name": "Ada" }</textarea>
            <div class="row"><button class="primary" data-act="execute">Execute</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            const wf = () => el.querySelector('[data-bind=workflowId]').value.trim();
            const ver = () => el.querySelector('[data-bind=versionId]').value.trim();
            el.querySelector('[data-act=validate]').onclick = async () => show(out, (await api("POST", "/workflows/" + wf() + "/validate")).data);
            el.querySelector('[data-act=activate]').onclick = async () => show(out, (await api("POST", "/workflows/" + wf() + "/activate", { versionId: ver() })).data);
            el.querySelector('[data-act=get]').onclick = async () => show(out, (await api("GET", "/workflows/" + wf())).data);
            el.querySelector('[data-act=versions]').onclick = async () => show(out, (await api("GET", "/workflows/" + wf() + "/versions")).data);
            el.querySelector('[data-act=list]').onclick = async () => show(out, (await api("GET", "/workflows")).data);
            el.querySelector('[data-act=execute]').onclick = async () => {
              const input = parseJSON(el.querySelector("[data-input]").value, {});
              const r = await api("POST", "/workflows/" + wf() + "/execute", { input });
              if (r.ok) { state.runId = r.data.data.runId; syncIds(); }
              show(out, r.data);
              if (r.ok) watchRun(r.data.data.runId); // light up the graph live
            };
          },
        },
        {
          title: "Test a node",
          html: `
            <div class="row"><input data-bind="workflowId" placeholder="workflowId" /><input data-node placeholder="nodeId (e.g. ai)" /></div>
            <label>sample input (JSON)</label>
            <textarea data-sample rows="3">{ "name": "Ada" }</textarea>
            <div class="row"><label><input type="checkbox" data-dry checked /> dryRun</label><button class="primary" data-act="test">test-node</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=test]').onclick = async () => {
              const body = { nodeId: el.querySelector("[data-node]").value.trim(), sampleInput: parseJSON(el.querySelector("[data-sample]").value, {}), dryRun: el.querySelector("[data-dry]").checked };
              show(out, (await api("POST", "/workflows/" + el.querySelector('[data-bind=workflowId]').value.trim() + "/test-node", body)).data);
            };
          },
        },
        {
          title: "Runs & metrics",
          html: `
            <div class="row"><button data-act="list">List runs</button><button data-act="metrics">Metrics</button></div>
            <div class="row"><input data-bind="runId" placeholder="runId" /><button data-act="get">Get run</button><button data-act="watch">Watch in graph</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=list]').onclick = async () => show(out, (await api("GET", "/runs")).data);
            el.querySelector('[data-act=metrics]').onclick = async () => show(out, (await api("GET", "/metrics")).data);
            el.querySelector('[data-act=get]').onclick = async () => show(out, (await api("GET", "/runs/" + el.querySelector('[data-bind=runId]').value.trim())).data);
            el.querySelector('[data-act=watch]').onclick = () => watchRun(el.querySelector('[data-bind=runId]').value.trim());
          },
        },
        {
          title: "Triggers: events & subscriptions",
          html: `
            <div class="row"><input data-etype placeholder="eventType" value="app.installed" /><input data-bind="workflowId" placeholder="workflowId" /></div>
            <div class="row"><button data-act="subscribe">Create subscription</button></div>
            <label>event payload (JSON)</label>
            <textarea data-payload rows="3">{ "name": "Ada" }</textarea>
            <div class="row"><button class="primary" data-act="emit">POST /events</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=subscribe]').onclick = async () =>
              show(out, (await api("POST", "/subscriptions", { eventType: el.querySelector("[data-etype]").value.trim(), workflowId: el.querySelector('[data-bind=workflowId]').value.trim() })).data);
            el.querySelector('[data-act=emit]').onclick = async () =>
              show(out, (await api("POST", "/events", { type: el.querySelector("[data-etype]").value.trim(), payload: parseJSON(el.querySelector("[data-payload]").value, {}) })).data);
          },
        },
        {
          title: "Credentials",
          html: `
            <div class="row"><input data-ctype placeholder="type (openrouter/smtp/...)" value="openrouter" /></div>
            <label>secret (JSON)</label>
            <textarea data-secret rows="2">{ "apiKey": "sk-or-..." }</textarea>
            <div class="row"><button class="primary" data-act="create">Create</button><button data-act="list">List</button></div>
            <div class="row"><input data-cid placeholder="credentialId" /><button data-act="del">Delete</button></div>
            <div class="out" data-out></div>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=create]').onclick = async () =>
              show(out, (await api("POST", "/credentials", { type: el.querySelector("[data-ctype]").value.trim(), secret: parseJSON(el.querySelector("[data-secret]").value, {}) })).data);
            el.querySelector('[data-act=list]').onclick = async () => show(out, (await api("GET", "/credentials")).data);
            el.querySelector('[data-act=del]').onclick = async () => show(out, (await api("DELETE", "/credentials/" + el.querySelector("[data-cid]").value.trim())).data);
          },
        },
        {
          title: "Approvals",
          html: `
            <div class="row"><input data-eid placeholder="eventId (from run/alert)" /></div>
            <div class="row"><label><input type="checkbox" data-approved checked /> approved</label><button class="primary" data-act="approve">POST /approvals</button></div>
            <div class="out" data-out></div>
            <p class="hint">Local mode auto-approves; this matters in qstash mode.</p>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=approve]').onclick = async () =>
              show(out, (await api("POST", "/approvals", { eventId: el.querySelector("[data-eid]").value.trim(), approved: el.querySelector("[data-approved]").checked })).data);
          },
        },
        {
          title: "API keys",
          html: `
            <div class="row"><input data-name placeholder="key name" value="dev-key" /><button data-act="create">Create</button><button data-act="list">List</button></div>
            <div class="out" data-out></div>
            <p class="hint">Paste a returned key into the "api key" field up top to test real auth.</p>`,
          wire(el) {
            const out = el.querySelector("[data-out]");
            el.querySelector('[data-act=create]').onclick = async () => show(out, (await api("POST", "/api-keys", { name: el.querySelector("[data-name]").value.trim() })).data);
            el.querySelector('[data-act=list]').onclick = async () => show(out, (await api("GET", "/api-keys")).data);
          },
        },
      ];

      const main = $("main");
      for (const c of cards) {
        const el = document.createElement("section");
        el.className = "card" + (c.wide ? " wide" : "");
        el.innerHTML = '<h2>' + c.title + '</h2><div class="body">' + c.html + "</div>";
        main.appendChild(el);
        c.wire(el);
      }
      syncIds();
    </script>
  </body>
</html>
